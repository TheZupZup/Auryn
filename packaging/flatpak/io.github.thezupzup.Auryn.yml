# Auryn — Flatpak manifest
#
# Build and install locally:
#
#   flatpak install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak-builder --user --install --force-clean \
#       build-dir packaging/flatpak/io.github.thezupzup.Auryn.yml
#   flatpak run io.github.thezupzup.Auryn
#
# See packaging/flatpak/README.md for the full walkthrough, the permission
# rationale, and how to regenerate python3-streamrip.json.

app-id: io.github.thezupzup.Auryn

# GNOME rather than plain org.freedesktop.Platform: Auryn is a GTK 3 +
# PyGObject app, and the GNOME runtime already ships GTK 3, python3 and the
# GObject introspection bindings. On the freedesktop runtime we would have to
# build PyGObject (and pycairo) ourselves for no benefit. Bump both versions
# together once per GNOME cycle — Flathub rejects end-of-life runtimes.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: auryn

# Minimal permissions that still leave Auryn useful. Anything not listed here
# is denied by the sandbox.
finish-args:
  # streamrip downloads from Deezer / Qobuz / TIDAL / SoundCloud over HTTPS,
  # and Auryn fetches cover art and lyrics. Without this nothing downloads.
  - --share=network
  # Shared memory with the display server. Required for X11 (MIT-SHM) and
  # conventionally paired with fallback-x11.
  - --share=ipc
  # Wayland first, with X11 as the fallback for non-Wayland sessions.
  - --socket=wayland
  - --socket=fallback-x11
  # Where finished music is written. These two are the only host directories
  # Auryn can see; the GTK folder chooser is therefore limited to them, which
  # is exactly the intent. Deliberately *not* --filesystem=home or =host.
  - --filesystem=xdg-music
  - --filesystem=xdg-download

# streamrip's config, Auryn's config.json and Auryn's logs all live in the
# per-app tree flatpak provides at ~/.var/app/io.github.thezupzup.Auryn/.
# streamrip finds its own config via click.get_app_dir("streamrip"), which
# honours $XDG_CONFIG_HOME — flatpak points that at the per-app tree already,
# so no environment variable needs to be set here and no ARL ever leaves the
# sandbox.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # streamrip and its full Python dependency tree, pinned to exact versions
  # with sha256 digests. Generated by flatpak-pip-generator; regenerate with
  # packaging/flatpak/generate-python-sources.sh. Nothing is resolved from the
  # network at build time, so the build is reproducible and Flathub-compatible.
  # Installs streamrip's console script at /app/bin/rip, which is what
  # core.flatpak resolves first inside the sandbox.
  - python3-streamrip.json

  - name: auryn
    buildsystem: simple
    build-commands:
      # Application code. Auryn.py adds its own directory to sys.path at
      # startup, so `from core import ...` resolves from /app/share/auryn.
      - install -Dm644 src/Auryn.py -t /app/share/auryn
      - install -Dm644 src/Auryn.ui -t /app/share/auryn
      - install -Dm644 src/core/*.py -t /app/share/auryn/core

      # Icon assets, where Auryn's _find_asset() looks for them at runtime
      # (<app dir>/assets) for the in-window logo.
      - install -Dm644 assets/Auryn.svg -t /app/share/auryn/assets
      - install -Dm644 assets/Auryn_256.png -t /app/share/auryn/assets

      # Launcher. `python3` is the runtime's interpreter, and /app/bin is on
      # PATH, so this is all that is needed to start the GUI.
      - install -Dm755 packaging/flatpak/auryn-launcher.sh /app/bin/auryn

      # Desktop integration. The .desktop, the metainfo and every icon must be
      # named after the app ID for the shell (and Flathub) to pick them up.
      - install -Dm644 packaging/flatpak/io.github.thezupzup.Auryn.desktop
        -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.thezupzup.Auryn.metainfo.xml
        -t /app/share/metainfo
      - install -Dm644 assets/Auryn.svg
        /app/share/icons/hicolor/scalable/apps/io.github.thezupzup.Auryn.svg
      - for s in 16 32 48 256; do install -Dm644 "assets/Auryn_${s}.png"
        "/app/share/icons/hicolor/${s}x${s}/apps/io.github.thezupzup.Auryn.png"; done
    sources:
      # Builds the working tree as-is, which is what makes `flatpak-builder`
      # usable straight from a checkout and in CI. Flathub submission will
      # need this swapped for a tagged `type: archive` or `type: git` source.
      - type: dir
        path: ../..
        skip:
          - .git
          - build-dir
          - dist
          - .flatpak-builder
