<?xml version="1.0" encoding="UTF-8"?>
<!-- Auryn app icon. Source of truth for all PNG/ICO sizes. -->
<!-- Export: see assets/README.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Premium deep-teal -> aqua tile gradient (the Auryn accent identity). -->
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B7C6F"/>
      <stop offset="100%" stop-color="#23C9B1"/>
    </linearGradient>
    <!-- Soft white -> sea-glass for the mark so it never looks flat. -->
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E6FFF9"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#tile)"/>
  <!-- Soft top highlight for app-tile depth -->
  <rect x="2" y="2" width="60" height="32" rx="15" ry="15" fill="#ffffff" opacity="0.08"/>

  <!-- Auryn monogram: a clean geometric "A" whose counter is a subtle play
       triangle — a quiet nod to music/playback, kept geometric and never
       literal. Reads as a confident "A" down to 16px. -->
  <path fill="url(#mark)" stroke="url(#mark)" stroke-width="1.5" stroke-linejoin="round" fill-rule="evenodd"
        d="M 32 15 L 47.5 49 L 40 49 L 36.8 42 L 27.2 42 L 24 49 L 16.5 49 Z
           M 29.9 29.4 L 29.9 38.4 L 36.7 33.9 Z"/>
</svg>
