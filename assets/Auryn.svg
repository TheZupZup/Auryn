<?xml version="1.0" encoding="UTF-8"?>
<!-- Auryn app icon. Source of truth for all PNG sizes. -->
<!-- Export: see assets/README.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FD1BE"/>
      <stop offset="100%" stop-color="#0E8C80"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E6FFFA"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#tile)"/>
  <!-- Soft top highlight -->
  <rect x="2" y="2" width="60" height="30" rx="15" ry="15" fill="#ffffff" opacity="0.07"/>

  <!-- Eighth note: head + stem + flag (the "music") -->
  <g fill="url(#mark)">
    <ellipse cx="23" cy="42" rx="8.5" ry="6.3" transform="rotate(-20 23 42)"/>
    <rect x="29.2" y="15" width="3.8" height="25" rx="1.9"/>
    <path d="M33 15 q12 2.5 11.5 14 q-3-7-11.5-9 Z"/>
  </g>

  <!-- Download arrow: the "downloader" idea, kept clean for small sizes -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <line x1="45" y1="34" x2="45" y2="45"/>
    <polyline points="40,40.5 45,46 50,40.5"/>
    <line x1="39" y1="50.5" x2="51" y2="50.5"/>
  </g>
</svg>
